name: CI

# Only the core requirements are installed. Pulling TensorFlow and PyTorch would
# turn a 30-second job into a 10-minute one to test 200 lines of pandas, and the
# tests that need them skip themselves cleanly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov=. --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install flake8 black

      # Blocking: syntax errors and undefined names are always real bugs.
      - name: Fail on syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__

      - name: Style report
        continue-on-error: true
        run: |
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=110 --statistics --exclude=.git,__pycache__
          black --check --diff . || true

  regenerate-data:
    name: Datasets regenerate from seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The CSVs are not committed. This proves they can always be rebuilt, so
      # nothing is lost by keeping ~900 KB of generated output out of git.
      - name: Regenerate the datasets
        run: |
          python project1_anomaly_detection/data/synthetic_network_logs.py
          test -s training_data_clean.csv
          test -s test_data_with_anomalies.csv
          wc -l training_data_clean.csv test_data_with_anomalies.csv
